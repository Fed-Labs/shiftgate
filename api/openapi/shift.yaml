openapi: 3.1.0
info:
  title: SHIFT Control Plane API
  version: 0.2.0
  description: |
    Fleet metadata and orchestration API for SHIFT. Raw computational state,
    checkpoint chunks, and workload keys remain on mutually authenticated agents.
servers:
  - url: http://127.0.0.1:8090
    description: Local development server
tags:
  - name: Health
  - name: Authentication
  - name: Organizations
  - name: Machines
  - name: Workloads
  - name: Migrations
  - name: Checkpoints
  - name: API Keys
  - name: Compute
  - name: Usage
  - name: Billing
  - name: Storage
  - name: Webhooks
  - name: SCIM
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      tags: [Health]
      operationId: metrics
      description: Prometheus scrape endpoint. The call must present the deployment's scrape token in the X-Metrics-Token header or as a bearer token; the endpoint fails closed, answering 401 (METRICS_UNAUTHORIZED) when no token is configured or the presented one does not match.
      parameters:
        - name: X-Metrics-Token
          in: header
          required: false
          description: Scrape token configured for the deployment (also accepted as a bearer token in Authorization).
          schema: { type: string }
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: The deployment requires a scrape token and none (or a wrong one) was presented (METRICS_UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /ready:
    get:
      tags: [Health]
      operationId: readiness
      responses:
        '200':
          description: PostgreSQL is reachable and the schema is applied
          content:
            application/json:
              schema:
                type: object
                required: [status, migrations]
                properties:
                  status: { type: string, enum: [ready] }
                  migrations: { type: string, enum: [applied] }
        '503':
          description: >
            Not ready. Database outage and schema state are distinguishable:
            database and schema-failure cases carry the Error shape, while a
            replica still catching up on schema migrations returns the
            readiness-state shape (no code/message).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    required: [status, migrations]
                    properties:
                      status: { type: string, enum: [not_ready] }
                      migrations: { type: string, enum: [pending] }
  /v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and initial organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: The email's domain requires single sign-on; accounts for it arrive through the issuer }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      description: |
        Authenticates with email and password. With `remember: true` the session
        carries the full refresh lifetime (refresh_token_ttl, 30 days by
        default); without it the refresh token expires after the short lifetime
        (short_refresh_token_ttl, 24 hours by default), so an ordinary sign-in
        does not live on for weeks on a shared machine. Rotation never extends
        past the lifetime granted at issue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The email's domain requires single sign-on; use the SSO flow instead }
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated session tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/sso/authorize:
    post:
      tags: [Authentication]
      operationId: ssoAuthorize
      description: Starts an OIDC single sign-on login. The redirect URI must be a loopback http URL; PKCE S256 is mandatory. Returns the issuer's authorization URL plus the state the client must echo back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SSOAuthorizeRequest' }
      responses:
        '200':
          description: Authorization URL and state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSOAuthorizeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: The issuer could not be reached }
        '503': { description: Single sign-on is not configured }
  /v1/auth/sso/token:
    post:
      tags: [Authentication]
      operationId: ssoToken
      description: Redeems the authorization code the loopback listener received. Validates the ID token's signature, issuer, audience, expiry, and nonce; links or provisions the local account; issues a session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SSOTokenRequest' }
      responses:
        '200':
          description: Session tokens for the federated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: The ID token failed validation }
        '403': { description: The account is disabled }
        '409': { description: The account is already federated to a different identity }
        '502': { description: The code exchange failed }
        '503': { description: Single sign-on is not configured }
  /v1/auth/sso/required:
    get:
      tags: [Authentication]
      operationId: ssoRequired
      description: Reports whether an email's domain is under SSO enforcement, so clients route to the issuer before asking for a password.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Enforcement answer
          content:
            application/json:
              schema:
                type: object
                required: [required]
                properties:
                  required: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/auth/github/authorize:
    post:
      tags: [Authentication]
      operationId: githubAuthorize
      description: |
        Starts "Sign in / Sign up with GitHub". Returns the GitHub authorization
        URL plus a server-signed state that binds the caller's post-login
        redirect_uri (validated like the billing portal's return_url: an
        absolute http(s) URL). The OAuth redirect_uri on the returned URL is
        always this control plane's own /v1/auth/github/callback — never the
        caller's URL; where the browser ends up afterwards is decided solely
        by the state, which is HMAC-sealed (token pepper) over the redirect_uri
        and a nonce with a short TTL. Answers 503 GITHUB_NOT_CONFIGURED on a
        deployment without GitHub OAuth credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubAuthorizeRequest' }
      responses:
        '200':
          description: Authorization URL and state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubAuthorizeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: Too many authentication attempts (RATE_LIMITED) }
        '503': { description: GitHub sign-in is not configured (GITHUB_NOT_CONFIGURED) }
  /v1/auth/github/callback:
    get:
      tags: [Authentication]
      operationId: githubCallback
      description: |
        Browser landing point after GitHub. Validates the signed state,
        exchanges the authorization code with GitHub entirely server-side
        (GitHub tokens never reach the browser), resolves the primary verified
        email — and, when the deployment allowlists GitHub organizations, the
        account's membership — then 302-redirects to the state-bound
        redirect_uri with a single-use, short-lived ?github_code= handoff to
        redeem at /v1/auth/github/token. Every failure after a valid state 302s
        to the same redirect_uri with ?error=<code> where <code> is one of
        github_auth_failed (exchange or profile read failed),
        github_access_denied (the user denied the grant at GitHub),
        github_email_not_verified (no primary verified email), or
        github_org_denied (member of no allowed organization) — every code is
        github_-prefixed. A malformed, forged, or expired state is answered in
        place with 400 GITHUB_STATE_INVALID and no redirect: with the binding
        unverified there is no trustworthy redirect target.
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the state-bound redirect_uri — success appends ?github_code=<one-time code>, failure appends ?error=<github_-prefixed code>
          headers:
            Location:
              schema: { type: string, format: uri }
        '400': { description: The state is malformed, forged, or expired (GITHUB_STATE_INVALID) — answered in place, never redirected }
        '503': { description: GitHub sign-in is not configured (GITHUB_NOT_CONFIGURED) }
  /v1/auth/github/token:
    post:
      tags: [Authentication]
      operationId: githubToken
      description: |
        Redeems the one-time ?github_code= handoff for a SHIFT session. The
        response is login's shape ({user, tokens}) and the refresh token obeys
        login's session_cookie rules (the httpOnly shift_rt cookie for browser
        sessions, body otherwise). Semantics: sign in when a user with this
        github_id exists; sign up — creating the user and initial organization
        exactly like register — when the verified GitHub email matches no
        account; link — attaching the GitHub identity, then signing in — when
        the email matches an account without one. The handoff code is single
        use and short lived: replayed (GITHUB_CODE_REPLAYED), expired
        (GITHUB_CODE_EXPIRED), and never-issued (GITHUB_CODE_INVALID) codes
        are refused 401. A verified email that no longer matches the linked
        account answers 401 GITHUB_EMAIL_MISMATCH; an email belonging to an
        account linked to a different GitHub identity answers 409
        GITHUB_ACCOUNT_CONFLICT; an SSO-enforced email domain answers 403
        SSO_REQUIRED (GitHub must not open a second door).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubTokenRequest' }
      responses:
        '200':
          description: Session tokens for the account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: The handoff code was replayed, expired, or invalid (GITHUB_CODE_REPLAYED / GITHUB_CODE_EXPIRED / GITHUB_CODE_INVALID), or the verified email no longer matches the account (GITHUB_EMAIL_MISMATCH) }
        '403': { description: The account is disabled (ACCOUNT_DISABLED) or the email domain requires single sign-on (SSO_REQUIRED) }
        '409': { description: The email belongs to an account linked to a different GitHub identity (GITHUB_ACCOUNT_CONFLICT) }
        '429': { description: Too many authentication attempts (RATE_LIMITED) }
        '503': { description: GitHub sign-in is not configured (GITHUB_NOT_CONFIGURED) }
  /v1/auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }, {}]
      operationId: logout
      description: Revokes the caller's session. A bearer access token and the httpOnly shift_rt refresh cookie are both accepted credentials — a browser whose access token has already expired can still log out through the cookie alone. With neither credential present the call is refused.
      responses:
        '204': { description: Session revoked }
        '400': { description: No revocable credential was presented (SESSION_TOKEN_REQUIRED) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      operationId: me
      responses:
        '200':
          description: Authenticated principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/users/me:
    delete:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      operationId: eraseCurrentUser
      summary: Erase the calling account's personal data (GDPR erasure)
      description: >
        Irreversibly anonymizes the caller's account in place: email, display
        name, and password hash are destroyed, every session is revoked, and
        audit IPs are scrubbed. The pseudonymous user row survives so audit
        trails and billing history keep valid references. The response is a
        counts-only report and never echoes destroyed data.
      responses:
        '200':
          description: Erasure completed; counts only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/organizations:
    get:
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      operationId: listOrganizations
      responses:
        '200':
          description: Organizations visible to the user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/members:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      operationId: upsertMember
      description: Requires admin or owner role. Owner cannot be assigned by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200': { description: Membership updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/EntitlementExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No user account exists for the given email (USER_NOT_FOUND) }
        '409': { description: The owner role cannot be changed (OWNER_ROLE_IMMUTABLE) }
  /v1/organizations/{organizationID}/relay/tickets:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Migrations]
      security: [{ bearerAuth: [] }]
      operationId: createRelayTicket
      description: Create a short-lived ticket for two registered agents to establish an outbound opaque relay. The relay never receives workload keys or plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_machine_id, destination_machine_id, migration_id]
              properties:
                source_machine_id: {type: string}
                destination_machine_id: {type: string}
                migration_id: {type: string}
                ttl_seconds: {type: integer, minimum: 10, maximum: 600}
      responses:
        '201':
          description: Relay ticket
          content:
            application/json: {schema: { $ref: '#/components/schemas/RelayTicket' }}
        '503': {description: Relay is not configured}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/ownership/acquire:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Workloads]
      security: [{ bearerAuth: [] }]
      operationId: acquireWorkloadOwnership
      description: Acquire the next monotone ownership epoch for a machine before fenced failover. The opaque token is returned once and never persisted in plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workload_id, machine_id, lease_seconds]
              properties:
                workload_id: { type: string }
                machine_id: { type: string }
                lease_seconds: { type: integer, minimum: 10, maximum: 600 }
      responses:
        '200':
          description: Ownership lease
          content:
            application/json: { schema: { $ref: '#/components/schemas/Ownership' } }
        '400': { description: workload_id, machine_id, and a lease between 10 and 600 seconds are required (OWNERSHIP_INVALID) }
        '404': { description: The machine is not registered in the organization (MACHINE_NOT_FOUND) }
        '409': { description: Another unexpired owner holds the workload }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/ownership/fence:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Workloads]
      security: [{ bearerAuth: [] }]
      operationId: fenceWorkloadOwnership
      description: Confirm a fenced failover — the calling machine presents the ownership token and epoch from acquire, proves the previous owner is fenced, and the ownership record is marked fenced. A stale epoch or wrong token is an ownership conflict (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workload_id, machine_id, epoch, token]
              properties:
                workload_id: { type: string }
                machine_id: { type: string }
                epoch: { type: integer, format: int64, minimum: 1 }
                token: { type: string, description: Opaque ownership token returned by acquire; never logged }
      responses:
        '200':
          description: Ownership is fenced at the presented epoch
          content:
            application/json:
              schema:
                type: object
                required: [state, epoch]
                properties:
                  state: { type: string, enum: [fenced] }
                  epoch: { type: integer, format: int64 }
        '400': { description: workload_id, machine_id, epoch, and token are required (OWNERSHIP_INVALID) }
        '409': { description: Ownership conflict — the epoch moved or the token does not match }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/machines:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Machines]
      security: [{ bearerAuth: [] }]
      operationId: listMachines
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Registered machines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Machine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Machines]
      security: [{ bearerAuth: [] }]
      operationId: createMachine
      description: Requires operator, admin, or owner role. The agent URL must be HTTPS.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMachineRequest' }
      responses:
        '201':
          description: Machine registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Machine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/EntitlementExceeded' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/machines/{machineID}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MachineID'
    post:
      tags: [Machines]
      security: [{ bearerAuth: [] }]
      operationId: machineHeartbeat
      description: Updates inventory and online state. Requires operator role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                agent_url: { type: string, format: uri }
                capabilities: { type: object, additionalProperties: true }
                status: { type: string, enum: [online, offline, draining] }
                transfer_bytes:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
                  description: >
                    Bandwidth deltas the agent metered since its previous
                    heartbeat, keyed by channel (relay, egress, restore,
                    peer). Recorded as usage_records for billing.
      responses:
        '200':
          description: Updated machine plus the live-migration gate signal for this organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineHeartbeatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/workloads:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Workloads]
      security: [{ bearerAuth: [] }]
      operationId: listWorkloads
      responses:
        '200':
          description: Workload metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Workloads]
      security: [{ bearerAuth: [] }]
      operationId: createWorkload
      description: Stores metadata only; execution remains on the selected agent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkloadRequest' }
      responses:
        '201':
          description: Workload metadata created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/workloads/{workloadID}/status:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/WorkloadID'
    post:
      tags: [Workloads]
      security: [{ bearerAuth: [] }]
      operationId: updateWorkloadStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated workload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/migrations:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Migrations]
      security: [{ bearerAuth: [] }]
      operationId: listMigrations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Migration jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MigrationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Migrations]
      security: [{ bearerAuth: [] }]
      operationId: createMigration
      description: Creates a metadata job. Agents execute the actual state transfer over their mutually authenticated peer channel. Retrying with the same Idempotency-Key returns the original job; reusing a key with different parameters is a conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Opaque retry key for exactly-once migration job creation within an organization.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMigrationRequest' }
      responses:
        '202':
          description: Migration queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationJob' }
        '400':
          description: Invalid request (MIGRATION_INVALID), malformed Idempotency-Key (IDEMPOTENCY_KEY_INVALID), unknown route (MIGRATION_ROUTE_INVALID), or a source machine the workload is not assigned to (MIGRATION_SOURCE_MISMATCH)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Live migration mode requires a live-migration-capable entitlement — a Business/Enterprise plan or an active Business trial (trial_active); the free tier is cold-only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Workload or machine was not found (MIGRATION_RESOURCE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The Idempotency-Key was reused with different parameters, or the workload already has a queued or running migration (MIGRATION_ALREADY_ACTIVE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/audit:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      operationId: listAuditEvents
      description: Requires admin or owner role. Newest first; `offset` walks deeper into the trail.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100, description: Requests above 500 are served 500 rows. }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/machines/capability:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Machines]
      security: [{ bearerAuth: [] }]
      operationId: queryMachinesByCapability
      description: >
        Fleet query answered from the relational projection of each machine's
        JSONB capability document. Only scalar capabilities (number, text,
        boolean) are projected; objects and arrays are not queryable.
      parameters:
        - name: capability
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [number, text, boolean] }
        - name: minimum
          in: query
          required: false
          description: Value floor; valid only with kind=number.
          schema: { type: number, format: double }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Machines reporting the capability, numbers ordered by value descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Machine' }
        '400':
          description: Missing capability, unknown kind, or minimum without kind=number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/retention:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      operationId: getRetentionPolicy
      description: Requires admin or owner role. Returns defaults when no policy was configured.
      responses:
        '200':
          description: Retention windows in days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      operationId: setRetentionPolicy
      description: >
        Requires admin or owner role. Omitted fields keep their current value;
        zero is the deliberate keep-forever policy. Changes are audited and
        take effect on the next enforcement sweep.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRetentionPolicyRequest' }
      responses:
        '200':
          description: Stored policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '400':
          description: Unknown field or a window outside 0-36500 days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/sso:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      operationId: getOrganizationSSO
      description: Requires admin or owner role. Reports the organization's SSO enforcement state.
      responses:
        '200':
          description: Enforcement state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSSO' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      operationId: setOrganizationSSO
      description: >
        Requires admin or owner role. Enforcing SSO claims an email domain:
        from that moment the domain's accounts authenticate through the
        configured OIDC issuer and local passwords stop working for them. A
        domain can be claimed by one organization at a time. Disabling clears
        the claim. Requires the control plane to have an OIDC issuer
        configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationSSO' }
      responses:
        '200':
          description: Stored enforcement state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSSO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Another organization already claims this domain }
        '503': { description: Single sign-on is not configured }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/entitlement:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      operationId: getEntitlement
      responses:
        '200':
          description: Current server-side limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: The organization has no entitlement row (ENTITLEMENT_NOT_FOUND) }
  /v1/organizations/{organizationID}/storage:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Storage]
      security: [{ bearerAuth: [] }]
      operationId: getStorageStatus
      description: |
        Platform-hosted checkpoint storage status. Usage is metered by
        reconciling actual object bytes in the organization's bucket prefix —
        never from agent claims — and refreshes synchronously when the stored
        figures are stale. When hosting is disabled the response is
        `{enabled: false}` with no location fields.
      responses:
        '200':
          description: Storage status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: The organization has no entitlement row (ENTITLEMENT_NOT_FOUND) }
  /v1/organizations/{organizationID}/storage/credentials:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Storage]
      security: [{ bearerAuth: [] }]
      operationId: getStorageCredentials
      description: |
        Short-lived, organization-scoped object-store credentials for agent
        mirroring. Agents call this with a machines-scope API key and refresh
        at half the credential lifetime. Over quota the response is 403 and
        no credentials are issued — mirroring stops while local checkpointing
        continues.
      responses:
        '200':
          description: Issued credentials; the secrets are shown once and never logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageCredentials' }
        '403':
          description: Over plan quota — issuance suspended until usage drops or the plan is upgraded
          content:
            application/json:
              schema:
                type: object
                required: [code, message, used_storage_bytes, max_storage_bytes]
                properties:
                  code: { type: string, enum: [STORAGE_QUOTA_EXCEEDED] }
                  message: { type: string }
                  used_storage_bytes: { type: integer, format: int64 }
                  max_storage_bytes: { type: integer, format: int64 }
        '404': { description: The organization has no entitlement row (ENTITLEMENT_NOT_FOUND) }
        '502': { description: The storage service did not issue credentials (STORAGE_CREDENTIALS_FAILED) }
        '503':
          description: This control plane does not host checkpoint storage
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [STORAGE_NOT_CONFIGURED] }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/storage/reconcile:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Storage]
      security: [{ bearerAuth: [] }]
      operationId: reconcileStorage
      description: Forces a usage recount from the bucket. Admin, billing scope.
      responses:
        '200':
          description: Refreshed status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: This control plane does not host checkpoint storage
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [STORAGE_NOT_CONFIGURED] }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/api-keys:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [API Keys]
      security: [{ bearerAuth: [] }]
      operationId: listAPIKeys
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      description: Lists API-key metadata. Secrets are never returned after creation.
      responses:
        '200':
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/APIKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [API Keys]
      security: [{ bearerAuth: [] }]
      operationId: createAPIKey
      description: Requires admin or owner role. The returned secret is shown once and is stored only as a digest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        '201':
          description: API key and one-time secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/api-keys/{keyID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/APIKeyID'
    delete:
      tags: [API Keys]
      security: [{ bearerAuth: [] }]
      operationId: revokeAPIKey
      responses:
        '204': { description: API key revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: API key was not found or already revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/checkpoints:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Checkpoints]
      security: [{ bearerAuth: [] }]
      operationId: listCheckpoints
      parameters:
        - name: workload_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Checkpoint metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Checkpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Checkpoints]
      security: [{ bearerAuth: [] }]
      operationId: registerCheckpoint
      description: Registers metadata produced by an agent. Raw checkpoint chunks remain on agents.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCheckpointRequest' }
      responses:
        '201':
          description: Checkpoint metadata created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/EntitlementExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { description: Workload or machine was not found }
        '422': { description: Incremental parent is unavailable or belongs to another workload }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/migrations/{migrationID}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MigrationID'
    get:
      tags: [Migrations]
      security: [{ bearerAuth: [] }]
      operationId: listMigrationEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Ordered migration stage events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MigrationEvent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/usage:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Usage]
      security: [{ bearerAuth: [] }]
      operationId: listUsage
      parameters:
        - name: from
          in: query
          description: Inclusive ISO-8601 calendar date. Defaults to one month ago.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Exclusive ISO-8601 calendar date. Defaults to tomorrow.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Usage records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/usage/summary:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Usage]
      security: [{ bearerAuth: [] }]
      operationId: getUsageSummary
      description: Self-serve usage summary (storage, transfer with fair-use throttle state, machines, migration health, seats, API budget). Admin/owner only.
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummaryReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/trial:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      operationId: getTrialStatus
      description: Trial state for the organization (eligible, started, expires, days left).
      responses:
        '200':
          description: Trial status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      operationId: startTrial
      description: Start the 14-day no-card Business trial (once per organization, ever). 402 TRIAL_ALREADY_USED when a trial row exists; 409 when a paid subscription is active. While the trial runs the entitlement reports trial_active and grants Business-tier capability (plan 2 BR-02).
      responses:
        '200':
          description: Trial started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialStarted' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/referral:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      operationId: getReferralStats
      description: Referral code and scoreboard (invited, activated, rewards). The code is issued lazily on first read.
      responses:
        '200':
          description: Referral stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationID}/referral/claim:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      operationId: claimReferral
      description: Stamp a referral code on an organization at signup. Self-referral (same org or same email domain) is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Referral claimed
          content:
            application/json:
              schema:
                type: object
                required: [status, code]
                properties:
                  status: { type: string, enum: [claimed] }
                  code: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Referral code was not found }
        '422': { description: Self-referral }
  /v1/organizations/{organizationID}/machines/{machineID}/commands:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MachineID'
    post:
      tags: [Machines]
      security: [{ bearerAuth: [] }]
      operationId: dispatchAgentCommand
      description: |
        Dispatches one action to the machine's agent over mutually authenticated
        HTTPS and records what the agent reported. The control plane performs no
        checkpoint or migration work itself; it only reconciles the agent's result.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCommandRequest' }
      responses:
        '200':
          description: Agent accepted the command and the result was reconciled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentCommandResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/EntitlementExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Machine, workload, checkpoint, or migration destination was not found }
        '409': { description: Machine has no reachable agent URL, or the agent reported a conflict }
        '502':
          description: Agent was unreachable, refused the command, or the result could not be reconciled
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/machines/{machineID}/commands/poll:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MachineID'
    get:
      tags: [Machines]
      security: [{ bearerAuth: [] }]
      operationId: pollAgentCommand
      description: |
        Long-poll endpoint the machine's agent calls to claim queued commands
        (migrate dispatch, relay start/join). Requires a machine-scoped API
        key bound to the same organization; user sessions are refused. An
        empty queue answers 204 No Content. Claimed commands must be settled
        through the complete endpoint.
      responses:
        '200':
          description: One claimed command
          content:
            application/json:
              schema:
                type: object
                required: [id, action, claim_token]
                properties:
                  id: { type: string }
                  action: { type: string }
                  payload: { type: object, additionalProperties: true }
                  claim_token: { type: string }
                  created_at: { type: string, format: date-time }
        '204': { description: No command queued for this machine }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not a machine-scoped API key for this organization }
  /v1/organizations/{organizationID}/machines/{machineID}/commands/{commandID}/complete:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MachineID'
      - $ref: '#/components/parameters/CommandID'
    post:
      tags: [Machines]
      security: [{ bearerAuth: [] }]
      operationId: completeAgentCommand
      description: |
        Settles a command the agent claimed via poll with its outcome. Requires
        the same machine-scoped API key and the one-use claim token returned by
        poll — a completion without it, or from another machine, is refused.
        User sessions are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [failed, claim_token]
              properties:
                failed: { type: boolean }
                claim_token: { type: string }
                error: { type: string }
      responses:
        '200':
          description: Command settled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not a machine-scoped API key for this organization }
        '409': { description: Command is not in a claimed state }
  /v1/organizations/{organizationID}/migrations/{migrationID}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/MigrationID'
    post:
      tags: [Migrations]
      security: [{ bearerAuth: [] }]
      operationId: cancelMigration
      description: |
        Asks the source agent to cancel an active migration, then records the
        cancellation. The agent is the authority on whether the workload was
        rolled back, so a cancellation is only recorded once the agent accepted it.
      responses:
        '202':
          description: Source agent accepted the cancellation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Migration was not found }
        '409': { description: Migration is not active, carries no agent identifier, or its source agent is unavailable }
        '500':
          description: Stored migration progress could not be read
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '502':
          description: Source agent was unreachable or the cancellation could not be reconciled
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/reconcile:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Workloads]
      security: [{ bearerAuth: [] }]
      operationId: reconcileFleet
      description: |
        Polls every enabled machine's agent for its workloads and checkpoint
        manifests and writes the observed state back. Per-resource failures are
        reported instead of aborting the sweep, so one unreachable machine does
        not hide the state of the rest of the fleet.
      responses:
        '200':
          description: Reconciliation sweep finished, including any per-resource failures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Machine registry could not be read
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/compute/offers:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Compute]
      security: [{ bearerAuth: [] }]
      operationId: listComputeOffers
      description: |
        Lists the offers this organization publishes, including withdrawn ones.
        Use the inventory endpoint to see what the organization may schedule
        against, which is a different set.
      responses:
        '200':
          description: Offers published by this organization
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ComputeOffer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Offers could not be read or decoded
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Compute]
      security: [{ bearerAuth: [] }]
      operationId: publishComputeOffer
      description: |
        Exposes a registered machine's resources to the scheduler. Machine name,
        agent URL, hardware capabilities, and presence come from the control
        plane's machine registry rather than from this body, so an operator
        cannot advertise hardware a machine does not have. A claimed trust tier
        is clamped to the evidence the control plane can actually produce, and a
        public offer requires the server-side compute trading gate to be on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishComputeOfferRequest' }
      responses:
        '201':
          description: Offer published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Machine is not registered in this organization }
        '409': { description: Public trading is disabled server-side, the machine is disabled, or the offer already exists }
        '500':
          description: Offer identifier could not be generated or machine capabilities were unreadable
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/compute/offers/{offerID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ComputeOfferID'
    delete:
      tags: [Compute]
      security: [{ bearerAuth: [] }]
      operationId: withdrawComputeOffer
      description: |
        Withdraws an offer so the scheduler stops selecting it. Live reservations
        already held against the offer are unaffected: capacity is handed back
        through the reservation state machine, never by deleting the offer.
      responses:
        '200':
          description: Offer withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeOffer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Offer was not found }
        '500':
          description: Offer could not be withdrawn
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/compute/inventory:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Compute]
      security: [{ bearerAuth: [] }]
      operationId: computeInventory
      description: |
        Returns the offers this organization may schedule against, together with
        the state of the public-trading gate so a client never has to guess why
        another organization's machines are absent. Each offer reports the
        capacity left after live reservations.
      responses:
        '200':
          description: Schedulable inventory and the state of the trading gate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeInventory' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Inventory could not be assembled
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/compute/placements:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Compute]
      security: [{ bearerAuth: [] }]
      operationId: computePlacement
      description: |
        Scores the schedulable inventory for one workload and returns both the
        ranked candidates and a typed rejection for every offer that was filtered
        out. Placement is advisory: it holds no capacity. A checkpoint identifier
        is resolved server-side into the stored manifest, so restore
        compatibility is checked against state that was actually captured rather
        than against client claims.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementRequest' }
      responses:
        '200':
          description: Ranked candidates and the reason each rejected offer was excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Referenced checkpoint was not found }
        '500':
          description: Inventory or checkpoint manifest could not be read
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/compute/reservations:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      tags: [Compute]
      security: [{ bearerAuth: [] }]
      operationId: listComputeReservations
      description: |
        Lists reservations held by this organization. Lapsed holds are expired
        before the list is assembled, so the returned states never overstate how
        much capacity is committed.
      parameters:
        - name: offer_id
          in: query
          description: Restricts the list to holds on one offer.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Reservations held by this organization
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ComputeReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Reservations could not be expired, read, or decoded
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Compute]
      security: [{ bearerAuth: [] }]
      operationId: createComputeReservation
      description: |
        Holds capacity on one offer. The offer row is locked, lapsed holds are
        expired, and the real scheduler is re-run against the locked offer, so a
        hold is never granted on terms a placement would have refused and two
        concurrent migrations cannot both plan for the same capacity. Every
        reservation expires: the default hold is 15 minutes and the ceiling is 24
        hours, so abandoned capacity is always reclaimed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateComputeReservationRequest' }
      responses:
        '201':
          description: Capacity reserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Offer was not found }
        '409': { description: Requested capacity is no longer available, or the reservation already exists }
        '422':
          description: Scheduler refused the offer on policy grounds; the body carries the rejection code
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/compute/reservations/{reservationID}/state:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ComputeReservationID'
    post:
      tags: [Compute]
      security: [{ bearerAuth: [] }]
      operationId: setComputeReservationState
      description: |
        Moves a reservation through its state machine. Released and expired are
        terminal: capacity that was handed back is never taken again under the
        same reservation identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComputeReservationStateRequest' }
      responses:
        '200':
          description: Reservation state changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Reservation was not found }
        '409': { description: Requested transition is not legal from the current state }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/public/stats:
    get:
      tags: [Public]
      operationId: getPublicStats
      description: Public numbers page payload (installs, restore medians, MRR band, cost band). Privacy-minimal counts and banded money only; unauthenticated by design.
      responses:
        '200':
          description: Public stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStats' }
  /v1/admin/scoreboard:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: getScoreboard
      description: Weekly scoreboard counters (week-over-week orgs, machines, checkpoints, migrations, subscriptions by plan, MRR band). Counts only. Restricted to admin grants — an API key carrying the admin scope, or a user session holding an admin or owner organization role; anything else is refused with 403.
      responses:
        '200':
          description: Scoreboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreboardCounters' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/plans:
    get:
      tags: [Billing]
      operationId: listPlans
      description: Returns the public plan catalog — the same plans and limits the control plane enforces entitlements from.
      responses:
        '200':
          description: Plan catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
  /v1/organizations/{organizationID}/billing/checkout:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      operationId: startCheckout
      description: Requires admin or owner role. Opens a Stripe-hosted checkout session for a catalog plan. The session carries only the organization id and plan key as metadata; limits are resolved server-side when the signed subscription webhook arrives.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: Checkout session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: Stripe rejected the checkout session request }
        '503': { description: Billing is not configured, or the plan has no Stripe price }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/organizations/{organizationID}/billing/portal:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    post:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      operationId: openBillingPortal
      description: Requires admin or owner role. Opens a Stripe billing-portal session for the organization's stored customer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalRequest' }
      responses:
        '200':
          description: Billing portal session
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: Stripe rejected the billing-portal session request }
        '503': { description: Billing is not configured }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/webhooks/stripe:
    post:
      tags: [Webhooks]
      operationId: stripeWebhook
      description: Verifies Stripe-Signature and processes subscription events idempotently.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses:
        '200': { description: Event processed, ignored, or already processed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '501': { description: Billing is disabled }
  /v1/scim/v2/ServiceProviderConfig:
    get:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimServiceProviderConfig
      description: SCIM v2 service provider configuration. Requires an API key with the scim scope.
      responses:
        '200':
          description: Capability statements
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/SCIMServiceProviderConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision (requires an API key with the scim scope) }
  /v1/scim/v2/ResourceTypes:
    get:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimResourceTypes
      description: The resource types this SCIM implementation serves. Users only; Groups is not implemented.
      responses:
        '200':
          description: Resource types
          content:
            application/scim+json: { schema: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision }
  /v1/scim/v2/Schemas:
    get:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimSchemas
      description: The SCIM schema definitions, stating exactly which attributes are stored.
      responses:
        '200':
          description: Schema definitions
          content:
            application/scim+json: { schema: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision }
  /v1/scim/v2/Users:
    get:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimListUsers
      description: >
        Lists provisioned users in the API key's organization. Filters support
        eq, co, sw, ew, and pr over userName, emails.value, displayName,
        externalId, and active, joined by "and". Responses use the ListResponse
        shape with startIndex/count pagination.
      parameters:
        - name: filter
          in: query
          required: false
          schema: { type: string }
          example: 'userName sw "dev-" and active eq true'
        - name: startIndex
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: count
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Provisioned users
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/SCIMListResponse' }
        '400': { description: Unsupported filter (SCIM error shape) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision }
    post:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimCreateUser
      description: Provisions a user. The account is created with no usable password and joins the organization as a viewer.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/SCIMUser' }
      responses:
        '201':
          description: Created user
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/SCIMUser' }
        '400': { description: Invalid user (SCIM error shape) }
        '402': { description: Seat ceiling reached — purchase more seats before provisioning users (SCIM error shape) }
        '409': { description: Email or external id already exists }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision }
  /v1/scim/v2/Users/{userID}:
    parameters: [{ $ref: '#/components/parameters/SCIMUserID' }]
    get:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimGetUser
      responses:
        '200':
          description: One provisioned user
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/SCIMUser' }
        '404': { description: Not found (SCIM error shape) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision }
    put:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimReplaceUser
      description: Full replacement of the idP-controlled fields.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/SCIMUser' }
      responses:
        '200':
          description: Replaced user
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/SCIMUser' }
        '404': { description: Not found (SCIM error shape) }
        '409': { description: Email or external id already exists }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision }
    patch:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimPatchUser
      description: >
        Partial update. Only the "replace" operation is supported, on active,
        displayName, externalId, and userName. Unsupported operations and paths
        are rejected rather than silently dropped.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/SCIMPatchRequest' }
      responses:
        '200':
          description: Patched user
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/SCIMUser' }
        '400': { description: Unsupported operation or path (SCIM error shape) }
        '404': { description: Not found (SCIM error shape) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision }
    delete:
      tags: [SCIM]
      security: [{ bearerAuth: [] }]
      operationId: scimDeleteUser
      description: >
        SCIM delete deactivates the account: live sessions are revoked in the
        same transaction, and the row survives so audit trails keep pointing
        at a real account.
      responses:
        '204': { description: Deactivated }
        '404': { description: Not found (SCIM error shape) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The credential cannot provision }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SHIFT access token
      description: >
        A SHIFT session access token or a SHIFT API key (prefix shift_ak_,
        secret shown once at creation) sent as "Bearer …". Which credentials
        an operation accepts is stated per operation: SCIM provisioning is
        machine-to-machine and accepts only API keys carrying the scim scope —
        user session tokens are refused there.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum records to return in one page. Defaults to 100; values above the server cap of 500 are clamped.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Offset:
      name: offset
      in: query
      required: false
      description: Number of matching records to skip before the page (pagination by offset over a stable newest-first order).
      schema: { type: integer, minimum: 0, default: 0 }
    OrganizationID:
      name: organizationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SCIMUserID:
      name: userID
      in: path
      required: true
      schema: { type: string }
      description: The SHIFT user id as returned in the SCIM User resource.
    MachineID:
      name: machineID
      in: path
      required: true
      schema: { type: string }
    CommandID:
      name: commandID
      in: path
      required: true
      schema: { type: string }
    WorkloadID:
      name: workloadID
      in: path
      required: true
      schema: { type: string, format: uuid }
    MigrationID:
      name: migrationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    APIKeyID:
      name: keyID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComputeOfferID:
      name: offerID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComputeReservationID:
      name: reservationID
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Authentication failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authorization failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Resource conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    EntitlementExceeded:
      description: Server-side plan limit exceeded
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PaymentRequired:
      description: A paid plan (or an unconverted trial entitlement) is required for this feature — e.g. TRIAL_ALREADY_USED when the organization already spent its one trial
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
    Health:
      type: object
      required: [status, version, started_at, uptime]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        started_at: { type: string, format: date-time }
        uptime: { type: string }
    Role:
      type: string
      enum: [owner, admin, operator, viewer]
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, writeOnly: true }
        display_name: { type: string, maxLength: 200 }
        organization: { type: string, maxLength: 200 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
        remember:
          type: boolean
          default: false
          description: |
            Ask for the full refresh-token lifetime (refresh_token_ttl, 30 days
            by default). Without it the session is granted the short refresh
            lifetime (short_refresh_token_ttl, 24 hours by default), so a
            browser-session login ends when its refresh token expires.
        session_cookie:
          type: boolean
          default: false
          description: |
            Issue the rotating refresh token as the httpOnly shift_rt cookie
            instead of the response body (also triggered by a browser
            Sec-Fetch-Mode: cors request). The cookie is HttpOnly, Secure,
            SameSite=Strict, Path=/v1/auth, with the session's refresh
            lifetime as Max-Age.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
          description: |
            Optional when the shift_rt cookie is present: the cookie is the
            refresh credential and wins when both are supplied.
        session_cookie: { type: boolean, default: false }
    SessionTokens:
      type: object
      required: [session_id, access_token, token_type, expires_at]
      properties:
        session_id: { type: string, format: uuid }
        access_token: { type: string, writeOnly: true }
        refresh_token:
          type: string
          writeOnly: true
          description: Omitted for cookie sessions — the rotating token then travels only in the httpOnly shift_rt cookie.
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
    Principal:
      type: object
      required: [session_id, user_id, email, display_name]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        organization_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        api_key_id: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIKeyScope' }
    ErasureReport:
      type: object
      description: Counts-only summary of a GDPR erasure; never carries the destroyed data
      required: [user_id, email_anonymized, sessions_removed, api_keys_removed, audit_ips_scrubbed]
      properties:
        user_id: { type: string }
        email_anonymized: { type: boolean }
        sessions_removed: { type: integer }
        api_keys_removed: { type: integer }
        audit_ips_scrubbed: { type: integer }
    RegisterResponse:
      type: object
      required: [user, organization, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organization: { $ref: '#/components/schemas/Organization' }
        tokens: { $ref: '#/components/schemas/SessionTokens' }
    LoginResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/SessionTokens' }
    CreateMachineRequest:
      type: object
      required: [machine_id, name, agent_url]
      properties:
        machine_id: { type: string, maxLength: 256 }
        name: { type: string, maxLength: 200 }
        agent_url: { type: string, format: uri, pattern: '^https://' }
        local_agent_url: { type: string, description: Explicit Unix-socket endpoint for control-plane dispatch; never inferred from agent_url }
        capabilities: { type: object, additionalProperties: true }
    Machine:
      type: object
      required: [id, organization_id, machine_id, name, agent_url, capabilities, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        machine_id: { type: string }
        name: { type: string }
        agent_url: { type: string, format: uri }
        local_agent_url: { type: string, description: Explicit Unix-socket endpoint for control-plane dispatch; never inferred from agent_url }
        capabilities: { type: object, additionalProperties: true }
        status: { type: string, enum: [online, offline, draining, disabled] }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MachineHeartbeatResponse:
      allOf:
        - $ref: '#/components/schemas/Machine'
        - type: object
          required: [live_migration_allowed]
          properties:
            live_migration_allowed:
              type: boolean
              description: >
                Whether this organization may dispatch live-mode migrations
                right now — the plan tier combined with subscription/trial
                state. Agents read this signal instead of asserting
                live-migration rights themselves.
    CreateWorkloadRequest:
      type: object
      required: [name, spec]
      properties:
        machine_id: { type: string }
        name: { type: string, maxLength: 200 }
        spec: { type: object, additionalProperties: true }
        status: { type: object, additionalProperties: true }
    Workload:
      type: object
      required: [id, organization_id, name, spec, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        machine_id: { type: string }
        name: { type: string }
        spec: { type: object, additionalProperties: true }
        status: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateMigrationRequest:
      type: object
      required: [workload_id, source_machine_id, destination_machine_id]
      properties:
        workload_id: { type: string, format: uuid }
        source_machine_id: { type: string }
        destination_machine_id: { type: string }
        mode: { type: string, enum: [cold, live], default: cold }
        route: { type: string, enum: [direct, relay], description: Transfer route; relay routes the encrypted chunks through the platform relay }
        idempotency_key: { type: string, maxLength: 255, description: Optional retry key; the Idempotency-Key header is preferred }
        timeout_seconds: { type: integer, minimum: 0 }
    MigrationJob:
      type: object
      required: [id, organization_id, workload_id, source_machine_id, destination_machine_id, mode, status, progress, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        workload_id: { type: string, format: uuid }
        source_machine_id: { type: string }
        destination_machine_id: { type: string }
        mode: { type: string, enum: [cold, live] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        progress: { type: object, additionalProperties: true }
        error_message: { type: string }
        created_by: { type: string, format: uuid }
        idempotency_key: { type: string, maxLength: 255 }
        attempt_count: { type: integer, minimum: 0 }
        lease_owner: { type: string }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        agent_migration_id: { type: string }
        managed: { type: boolean }
        route: { type: string, enum: [direct, relay] }
        relay_endpoint: { type: string, description: Relay bridge endpoint when route is relay }
        relay_ticket: { type: string, description: One-use relay ticket for the transfer session; do not log }
        cancel_requested: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    Entitlement:
      type: object
      required: [organization_id, plan, status, max_storage_bytes, used_storage_bytes, max_machines]
      properties:
        organization_id: { type: string, format: uuid }
        plan: { type: string, enum: [free, pro, business, enterprise, paid] }
        status: { type: string }
        max_storage_bytes: { type: integer, format: int64, description: -1 means unlimited }
        used_storage_bytes: { type: integer, format: int64, minimum: 0 }
        max_machines: { type: integer, description: -1 means unlimited }
        stripe_customer_id: { type: string }
        trial_active:
          type: boolean
          description: >
            True while the organization's 14-day no-card Business trial is
            running. For the trial window the organization holds the Business
            entitlement (plan 2 BR-02): clients treat trial_active as
            Business-tier capability — including live migration — even though
            plan still reads the subscribed key.
    StorageStatus:
      type: object
      required: [enabled, used_storage_bytes, max_storage_bytes, over_quota]
      properties:
        enabled: { type: boolean, description: False when this control plane does not host storage; location fields are then absent }
        endpoint: { type: string, description: Object-store endpoint handed to agents }
        bucket: { type: string }
        prefix: { type: string, description: The organization's exclusive key prefix, "org/{organizationID}/" }
        used_storage_bytes: { type: integer, format: int64, minimum: 0, description: Reconciled from actual bucket bytes }
        max_storage_bytes: { type: integer, format: int64, description: -1 means unlimited }
        over_quota: { type: boolean }
        last_reconciled_at: { type: string, format: date-time }
    RelayTicket:
      type: object
      required: [endpoint, token, expires_at, organization_id, source_machine_id, destination_machine_id, migration_id]
      properties:
        endpoint: {type: string, description: Relay bridge endpoint both agents connect to for this ticket}
        token: {type: string, description: Short-lived one-use ticket; do not log}
        expires_at: {type: string, format: date-time}
        organization_id: {type: string}
        source_machine_id: {type: string}
        destination_machine_id: {type: string}
        migration_id: {type: string}
    TrialStatus:
      type: object
      description: Trial state for one organization. Not-yet-started organizations read trial=false and eligible=true.
      required: [organization_id, trial, eligible]
      properties:
        organization_id: { type: string, format: uuid }
        trial: { type: boolean, description: Whether a trial has been started (a trial row exists) }
        eligible: { type: boolean, description: True when the organization has never used its one trial }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        days_left: { type: integer, minimum: 0 }
        converted: { type: boolean, description: Whether the trial converted to a paid subscription }
    TrialStarted:
      type: object
      required: [organization_id, plan, trial, started_at, expires_at]
      properties:
        organization_id: { type: string, format: uuid }
        plan: { type: string, enum: [business], description: The trial grants the Business entitlement for the window }
        trial: { type: boolean }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ReferralStats:
      type: object
      required: [code, invited, activated, rewards_granted]
      properties:
        code: { type: string }
        invited: { type: integer, minimum: 0 }
        activated: { type: integer, minimum: 0 }
        rewards_granted: { type: integer, minimum: 0 }
        badge: { type: string }
    UsageSummaryReport:
      type: object
      description: Self-serve usage summary over roughly the last 30 days
      required: [period, storage, transfer, machines, migrations_7d, seats, api]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        storage:
          type: object
          required: [used_bytes, max_bytes, pct]
          properties:
            used_bytes: { type: integer, format: int64 }
            max_bytes: { type: integer, format: int64, description: -1 means unlimited }
            pct: { type: number, format: double }
        transfer:
          type: object
          required: [bytes_30d, limit_bytes, by_channel, throttle, resets_at]
          properties:
            bytes_30d: { type: integer, format: int64 }
            limit_bytes: { type: integer, format: int64, description: Fair-use monthly ceiling; -1 means unlimited }
            by_channel:
              type: object
              additionalProperties: { type: integer, format: int64 }
            throttle: { type: string, enum: [ok, warn, exceeded] }
            resets_at: { type: string, format: date-time }
        machines:
          type: object
          required: [online, total]
          properties:
            online: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        migrations_7d:
          type: object
          description: Seven-day migration-health counters keyed by outcome
          additionalProperties: { type: integer }
        seats:
          type: object
          required: [included, purchased, members]
          properties:
            included: { type: integer, minimum: 0 }
            purchased: { type: integer, minimum: 0 }
            members: { type: integer, minimum: 0 }
        api:
          type: object
          required: [requests_today, daily_budget]
          properties:
            requests_today: { type: integer, format: int64, minimum: 0 }
            daily_budget: { type: integer, description: -1 means unlimited }
    PublicStats:
      type: object
      description: Privacy-minimal public counters; money is banded by design and never exact
      required: [organizations, machines_registered, checkpoints_created, migrations_total, migrations_succeeded, restore_p50_ms, mrr_band_usd, cogs_band_usd, generated_at]
      properties:
        organizations: { type: integer, minimum: 0 }
        machines_registered: { type: integer, minimum: 0 }
        checkpoints_created: { type: integer, minimum: 0 }
        migrations_total: { type: integer, minimum: 0 }
        migrations_succeeded: { type: integer, minimum: 0 }
        restore_p50_ms: { type: integer, format: int64, minimum: 0 }
        mrr_band_usd: { type: string }
        cogs_band_usd: { type: string }
        generated_at: { type: string, format: date-time }
    ScoreboardCounters:
      type: object
      description: One week of platform counters with the previous week for deltas. Counts only; money is banded like the public stats
      required: [from, to, new_orgs, new_orgs_prev, machines_registered, machines_registered_prev, checkpoints_created, checkpoints_created_prev, migrations_attempted, migrations_succeeded, migrations_failed, active_subscriptions_by_plan, mrr_band_usd]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        new_orgs: { type: integer, minimum: 0 }
        new_orgs_prev: { type: integer, minimum: 0 }
        machines_registered: { type: integer, minimum: 0 }
        machines_registered_prev: { type: integer, minimum: 0 }
        checkpoints_created: { type: integer, minimum: 0 }
        checkpoints_created_prev: { type: integer, minimum: 0 }
        migrations_attempted: { type: integer, minimum: 0 }
        migrations_succeeded: { type: integer, minimum: 0 }
        migrations_failed: { type: integer, minimum: 0 }
        active_subscriptions_by_plan:
          type: object
          additionalProperties: { type: integer }
        mrr_band_usd: { type: string, description: Banded MRR (e.g. "$500–1k") — exact revenue never leaves the server }
    Ownership:
      type: object
      required: [workload_id, organization_id, epoch, owner_machine_id, state]
      properties:
        workload_id: { type: string }
        organization_id: { type: string }
        epoch: { type: integer, format: int64 }
        owner_machine_id: { type: string }
        state: { type: string, enum: [unowned, owned, fenced, conflict] }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        token: { type: string, description: Returned once; never persisted in plaintext }
    StorageCredentials:
      type: object
      required: [endpoint, region, bucket, prefix, access_key_id, secret_access_key, session_token, expiration]
      properties:
        endpoint: { type: string }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        access_key_id: { type: string }
        secret_access_key: { type: string, description: Returned once to the caller; never logged or audited }
        session_token: { type: string, description: Returned once to the caller; never logged or audited }
        expiration: { type: string, format: date-time }
        force_path_style: { type: boolean, description: True for S3-compatible stores addressed path-style }
    Plan:
      type: object
      required: [key, name, price_cents, description, features, max_machines, max_storage_bytes]
      properties:
        key: { type: string, enum: [free, pro, business, enterprise] }
        name: { type: string }
        price_cents: { type: integer, format: int64, description: Monthly price in cents; 0 is free and -1 is custom }
        per_seat: { type: boolean, description: Present and true when the price is charged per seat }
        description: { type: string }
        features:
          type: array
          items: { type: string }
        max_machines: { type: integer, description: -1 means unlimited }
        max_storage_bytes: { type: integer, format: int64, description: -1 means unlimited }
        live_migration: { type: boolean, description: Whether the plan's tier may dispatch live-mode migrations; the free tier is cold-only. An active Business trial (trial_active) grants the same capability }
        price_cents_annual: { type: integer, format: int64, description: Prepay price for a full year; 0 means no annual offer and -1 means custom }
        included_seats: { type: integer, minimum: 0, description: Members covered by the flat price before seat overage applies }
        seat_overage_cents: { type: integer, format: int64, minimum: 0 }
        seat_derived_storage: { type: boolean, description: Storage pools as max_storage_bytes + storage_per_seat_bytes x seats, hard-capped at storage_cap_bytes }
        storage_per_seat_bytes: { type: integer, format: int64, minimum: 0 }
        storage_cap_bytes: { type: integer, format: int64, minimum: 0 }
        team_members: { type: boolean }
        audit_logging: { type: boolean }
        sso_and_scim: { type: boolean }
        periodic_policies: { type: boolean }
        failover: { type: boolean }
        sourceguard: { type: boolean }
        sourceguard_credits_months: { type: integer, minimum: 0 }
        storage_reclaim: { type: boolean }
        relay_allowance_bytes: { type: integer, format: int64, minimum: 0, description: Included monthly platform-mediated transfer allotment }
        overage_storage_cents_per_gb: { type: integer, format: int64, minimum: 0 }
        overage_transfer_cents_per_gb: { type: integer, format: int64, minimum: 0 }
        overage_cap_cents_default: { type: integer, format: int64, minimum: 0, description: Default monthly overage spend cap the customer may raise }
        max_api_requests_per_day: { type: integer, description: Daily API budget; -1 means unlimited. Presence heartbeats are exempt }
        max_api_requests_per_hour: { type: integer, description: Burst ceiling; -1 means unlimited }
        max_migrations_per_day: { type: integer, description: Migration-job creation cap per organization; -1 means unlimited }
        history_retention_days: { type: integer, minimum: 0, description: How long checkpoint history and lineage stay queryable }
        trial_eligible: { type: boolean, description: Whether a never-subscribed organization can start the 14-day no-card trial for this tier }
    CheckoutRequest:
      type: object
      required: [plan, success_url, cancel_url]
      properties:
        plan: { type: string, enum: [pro, business] }
        success_url: { type: string, format: uri }
        cancel_url: { type: string, format: uri }
        seats: { type: integer, minimum: 1, description: Seat count for per-seat plans }
    CheckoutSession:
      type: object
      required: [url, session_id, plan]
      properties:
        url: { type: string, format: uri }
        session_id: { type: string }
        plan: { type: string }
    PortalRequest:
      type: object
      required: [return_url]
      properties:
        return_url: { type: string, format: uri }
    AuditEvent:
      type: object
      required: [id, action, resource_type, metadata, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string }
        actor_user_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        metadata: { type: object, additionalProperties: true }
        request_id: { type: string }
        remote_addr: { type: string }
        created_at: { type: string, format: date-time }
    APIKeyScope:
      type: string
      enum: [read, operate, admin, machines, workloads, migrations, checkpoints, compute, scim]
      description: read/operate/admin are broad grants; resource scopes are limited to one resource family; scim allows directory provisioning through the SCIM v2 endpoints.
    CreateAPIKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: { $ref: '#/components/schemas/APIKeyScope' }
        expires_at: { type: string, format: date-time, nullable: true }
    APIKey:
      type: object
      required: [id, organization_id, name, prefix, scopes, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: Non-secret display prefix }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIKeyScope' }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    APIKeyCreated:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, writeOnly: true, description: Store immediately; never returned again }
    RetentionPolicy:
      type: object
      required: [organization_id, audit_retention_days, checkpoint_retention_days, deleted_storage_retention_days, updated_at]
      properties:
        organization_id: { type: string, format: uuid }
        audit_retention_days: { type: integer, minimum: 0, maximum: 36500, description: 0 keeps audit events forever }
        checkpoint_retention_days: { type: integer, minimum: 0, maximum: 36500, description: 0 keeps checkpoints forever; expired checkpoints are marked deleted, their rows survive }
        deleted_storage_retention_days: { type: integer, minimum: 0, maximum: 36500, description: Grace period after soft deletion before storage-object rows are purged }
        updated_at: { type: string, format: date-time }
    SetRetentionPolicyRequest:
      type: object
      description: Every field is optional; omitted fields keep their current value while zero means keep forever.
      minProperties: 1
      properties:
        audit_retention_days: { type: integer, minimum: 0, maximum: 36500 }
        checkpoint_retention_days: { type: integer, minimum: 0, maximum: 36500 }
        deleted_storage_retention_days: { type: integer, minimum: 0, maximum: 36500 }
    SSOAuthorizeRequest:
      type: object
      required: [email, redirect_uri, code_challenge]
      properties:
        email: { type: string, format: email }
        redirect_uri: { type: string, description: Loopback http URL only (127.0.0.1, localhost, or ::1), per RFC 8252 }
        code_challenge: { type: string, minLength: 43, maxLength: 128, description: S256 challenge of the client's PKCE verifier }
    SSOAuthorizeResponse:
      type: object
      required: [authorization_url, state]
      properties:
        authorization_url: { type: string, format: uri, description: The issuer's authorization endpoint with PKCE, state, and nonce applied }
        state: { type: string, description: The state the issuer will echo back; send it again when redeeming the code }
    SSOTokenRequest:
      type: object
      required: [code, state, code_verifier, redirect_uri]
      properties:
        code: { type: string, minLength: 16 }
        state: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        redirect_uri: { type: string, description: Must byte-match the one that started the flow }
    GitHubAuthorizeRequest:
      type: object
      required: [redirect_uri]
      properties:
        redirect_uri:
          type: string
          format: uri
          description: |
            Where the browser lands after the callback — an absolute http(s)
            URL (the billing portal's return_url rule). The callback appends
            ?github_code=<one-time code> on success or ?error=<github_-prefixed
            code> on failure, preserving any query the URL already carries.
    GitHubAuthorizeResponse:
      type: object
      required: [authorize_url, state]
      properties:
        authorize_url:
          type: string
          format: uri
          description: |
            The GitHub authorization URL (https://github.com/login/oauth/authorize)
            carrying client_id, scope "read:user user:email", this control
            plane's /v1/auth/github/callback as the OAuth redirect_uri, and the
            signed state. Navigate the browser here verbatim.
        state:
          type: string
          description: The server-signed state binding the redirect_uri; GitHub echoes it to the callback, which validates it before redirecting anywhere
    GitHubTokenRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: The one-time ?github_code= handoff value the callback redirected with }
        session_cookie:
          type: boolean
          default: false
          description: |
            Issue the rotating refresh token as the httpOnly shift_rt cookie
            instead of the response body (also triggered by a browser
            Sec-Fetch-Mode: cors request) — the same semantics as
            LoginRequest.session_cookie.
    OrganizationSSO:
      type: object
      required: [enforced, email_domain]
      properties:
        enforced: { type: boolean }
        email_domain: { type: string, description: The claimed domain; empty when enforcement is off }
    SCIMServiceProviderConfig:
      type: object
      description: Capability statements per RFC 7643 §8.5. patch, filter, and authentication are supported; bulk, changePassword, sort, and etag are not.
      additionalProperties: true
    SCIMUser:
      type: object
      description: The SCIM v2 User as this control plane stores it. userName is the account's email — one address per account.
      properties:
        schemas: { type: array, items: { type: string }, example: ['urn:ietf:params:scim:schemas:core:2.0:User'] }
        id: { type: string, readOnly: true }
        externalId: { type: string, maxLength: 256 }
        userName: { type: string, format: email }
        displayName: { type: string, maxLength: 200 }
        active: { type: boolean }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string, format: email }
              primary: { type: boolean }
        meta: { type: object, additionalProperties: true, readOnly: true }
    SCIMListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas: { type: array, items: { type: string } }
        totalResults: { type: integer }
        startIndex: { type: integer }
        itemsPerPage: { type: integer }
        Resources: { type: array, items: { $ref: '#/components/schemas/SCIMUser' } }
    SCIMPatchRequest:
      type: object
      required: [Operations]
      properties:
        schemas: { type: array, items: { type: string } }
        Operations:
          type: array
          minItems: 1
          items:
            type: object
            required: [op, path]
            properties:
              op: { type: string, enum: [replace], description: Only replace is supported }
              path: { type: string, enum: [active, displayName, externalId, userName] }
              value: { description: The replacement value — boolean for active, string for the rest }
    CreateCheckpointRequest:
      type: object
      required: [id, workload_id, machine_id, kind, plain_bytes, stored_bytes, chunk_count]
      properties:
        id: { type: string, format: uuid }
        workload_id: { type: string, format: uuid }
        machine_id: { type: string }
        kind: { type: string, enum: [full, incremental] }
        parent_id: { type: string, format: uuid }
        manifest: { type: object, additionalProperties: true }
        plain_bytes: { type: integer, format: int64, minimum: 0 }
        stored_bytes: { type: integer, format: int64, minimum: 0 }
        chunk_count: { type: integer, minimum: 0 }
    Checkpoint:
      type: object
      required: [id, organization_id, workload_id, machine_id, kind, manifest, plain_bytes, stored_bytes, chunk_count, status, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        workload_id: { type: string, format: uuid }
        machine_id: { type: string }
        kind: { type: string, enum: [full, incremental] }
        parent_id: { type: string, format: uuid }
        manifest: { type: object, additionalProperties: true }
        plain_bytes: { type: integer, format: int64, minimum: 0 }
        stored_bytes: { type: integer, format: int64, minimum: 0 }
        chunk_count: { type: integer, minimum: 0 }
        status: { type: string, enum: [creating, available, corrupt, deleted] }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    MigrationEvent:
      type: object
      required: [id, sequence, stage, message, progress, bytes_done, bytes_total, created_at]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64 }
        stage: { type: string }
        message: { type: string }
        progress: { type: number, format: double, minimum: 0, maximum: 1 }
        bytes_done: { type: integer, format: int64, minimum: 0 }
        bytes_total: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
    UsageSummary:
      type: object
      required: [kind, quantity, period_start, period_end]
      properties:
        kind: { type: string, enum: [checkpoint_storage, transfer_bytes, machine_hours, api_requests] }
        quantity: { type: integer, format: int64, minimum: 0 }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
    ComputeResources:
      type: object
      description: Resource quantities. CPU counts and network rates are fractional so shared machines can be expressed exactly.
      properties:
        cpu_count: { type: number, format: double, minimum: 0 }
        memory_bytes: { type: integer, format: int64, minimum: 0 }
        storage_bytes: { type: integer, format: int64, minimum: 0 }
        network_mbps: { type: number, format: double, minimum: 0 }
        gpus:
          type: array
          items: { type: object, additionalProperties: true }
    ComputePricing:
      type: object
      description: |
        Prices in integer micro-units of the stated currency, where one micro-unit
        is one millionth of a currency unit. Money is never represented as a
        binary floating-point number.
      required: [currency]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        cpu_hour_micros: { type: integer, format: int64, minimum: 0 }
        memory_gib_hour_micros: { type: integer, format: int64, minimum: 0 }
        storage_gib_hour_micros: { type: integer, format: int64, minimum: 0 }
        gpu_hour_micros: { type: integer, format: int64, minimum: 0 }
        egress_gib_micros: { type: integer, format: int64, minimum: 0 }
        minimum_charge_micros: { type: integer, format: int64, minimum: 0 }
        billing_increment_hours: { type: integer, format: int64, minimum: 0 }
    ComputeGeography:
      type: object
      properties:
        region: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2 country code. }
        zone: { type: string }
    ComputeVisibility:
      type: string
      enum: [private, organization, public]
      description: |
        private is never schedulable by anyone else; organization is schedulable
        inside the owning organization; public additionally requires the
        server-side compute trading gate.
    ComputeTrustTier:
      type: string
      enum: [unverified, community, organization, verified]
      description: |
        How much the control plane can substantiate about the machine behind an
        offer. A claimed tier is clamped to what the control plane can prove: a
        publisher cannot promote its own trust.
    ComputeOfferStatus:
      type: string
      enum: [available, reserved, draining, withdrawn]
    ComputePolicy:
      type: object
      required: [visibility]
      properties:
        visibility: { $ref: '#/components/schemas/ComputeVisibility' }
        allowed_organizations:
          type: array
          items: { type: string, format: uuid }
        denied_organizations:
          type: array
          items: { type: string, format: uuid }
        allowed_countries:
          type: array
          items: { type: string }
        max_state_bytes: { type: integer, format: int64, minimum: 0 }
        max_duration_hours: { type: integer, format: int64, minimum: 0 }
        require_encrypted_state: { type: boolean }
        gpu_sharing_allowed: { type: boolean }
    ComputeAvailability:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ComputeOfferStatus' }
        window_from: { type: string, format: date-time, nullable: true }
        window_to: { type: string, format: date-time, nullable: true }
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Machine presence, taken from the registry. An offer whose machine stopped reporting is rejected as stale.
    LatencySample:
      type: object
      required: [observer, round_trip_ms, measured_at]
      properties:
        observer: { type: string, description: 'A machine id, "region:<region>", or "country:<code>".' }
        round_trip_ms: { type: number, format: double, minimum: 0 }
        measured_at: { type: string, format: date-time }
        sample_count: { type: integer, minimum: 0 }
    PublishComputeOfferRequest:
      type: object
      required: [machine_id, exposed, pricing]
      properties:
        machine_id: { type: string, description: Must name a machine already registered in this organization. }
        exposed: { $ref: '#/components/schemas/ComputeResources' }
        pricing: { $ref: '#/components/schemas/ComputePricing' }
        geography: { $ref: '#/components/schemas/ComputeGeography' }
        policy: { $ref: '#/components/schemas/ComputePolicy' }
        trust:
          allOf: [{ $ref: '#/components/schemas/ComputeTrustTier' }]
          description: A claim only. The control plane clamps it to the tier it can substantiate.
        status: { $ref: '#/components/schemas/ComputeOfferStatus' }
        window_from: { type: string, format: date-time, nullable: true }
        window_to: { type: string, format: date-time, nullable: true }
        latency:
          type: array
          items: { $ref: '#/components/schemas/LatencySample' }
    ComputeOffer:
      type: object
      required: [id, organization_id, machine_id, exposed, committed, available, pricing, geography, policy, availability, trust, identity_verified, capabilities, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        machine_id: { type: string }
        machine_name: { type: string }
        agent_url: { type: string, format: uri }
        exposed: { $ref: '#/components/schemas/ComputeResources' }
        committed:
          allOf: [{ $ref: '#/components/schemas/ComputeResources' }]
          description: Capacity held by live reservations.
        available:
          allOf: [{ $ref: '#/components/schemas/ComputeResources' }]
          description: Exposure minus live reservations. This is the figure to schedule against.
        pricing: { $ref: '#/components/schemas/ComputePricing' }
        geography: { $ref: '#/components/schemas/ComputeGeography' }
        policy: { $ref: '#/components/schemas/ComputePolicy' }
        availability: { $ref: '#/components/schemas/ComputeAvailability' }
        trust: { $ref: '#/components/schemas/ComputeTrustTier' }
        identity_verified:
          type: boolean
          description: True only when the machine's signed identity was actually checked. Never inferred from the offer itself.
        capabilities:
          type: object
          additionalProperties: true
          description: Hardware and CRIU capabilities as reported by the machine registry, not by the publisher.
        latency:
          type: array
          items: { $ref: '#/components/schemas/LatencySample' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        withdrawn_at: { type: string, format: date-time, nullable: true }
    ComputeInventory:
      type: object
      required: [trading_enabled, offers]
      properties:
        trading_enabled:
          type: boolean
          description: Whether the server-side public compute trading gate is on. It is off by default.
        offers:
          type: array
          items: { $ref: '#/components/schemas/ComputeOffer' }
    ComputeConstraints:
      type: object
      description: Hard filters. Every offer that fails one is returned as a typed rejection rather than silently dropped.
      properties:
        allowed_regions: { type: array, items: { type: string } }
        denied_regions: { type: array, items: { type: string } }
        allowed_countries: { type: array, items: { type: string } }
        denied_countries: { type: array, items: { type: string } }
        min_trust: { $ref: '#/components/schemas/ComputeTrustTier' }
        max_price_micros_per_hour: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        max_latency_millis: { type: number, format: double, minimum: 0 }
        required_features: { type: array, items: { type: string } }
        exclude_machine_ids: { type: array, items: { type: string } }
        include_other_organizations:
          type: boolean
          description: Cross-organization placement must be requested explicitly, even when the trading gate is open.
        state_is_encrypted: { type: boolean }
        shares_gpu: { type: boolean }
    ComputeWeights:
      type: object
      description: Relative scoring weights. Defaults are capability 0.20, price 0.25, latency 0.20, trust 0.15, locality 0.10, freshness 0.10.
      required: [capability, price, latency, trust, locality, freshness]
      properties:
        capability: { type: number, format: double, minimum: 0 }
        price: { type: number, format: double, minimum: 0 }
        latency: { type: number, format: double, minimum: 0 }
        trust: { type: number, format: double, minimum: 0 }
        locality: { type: number, format: double, minimum: 0 }
        freshness: { type: number, format: double, minimum: 0 }
    PlacementRequest:
      type: object
      required: [requirements]
      properties:
        workload_id: { type: string, format: uuid }
        checkpoint_id:
          type: string
          format: uuid
          description: Resolved server-side into the stored manifest so restore compatibility is checked against captured state.
        source_machine_id: { type: string, description: Excluded from the results; a workload is never placed back on its own machine. }
        source_geography: { $ref: '#/components/schemas/ComputeGeography' }
        requirements: { $ref: '#/components/schemas/ComputeResources' }
        state_bytes: { type: integer, format: int64, minimum: 0 }
        duration_seconds: { type: integer, format: int64, minimum: 0 }
        constraints: { $ref: '#/components/schemas/ComputeConstraints' }
        weights: { $ref: '#/components/schemas/ComputeWeights' }
        limit: { type: integer, minimum: 0, description: Truncates the ranked candidates. Rejections are always complete. }
    ComputeScores:
      type: object
      description: Per-dimension scores in the range 0 to 1, and their weighted total.
      required: [capability, price, latency, trust, locality, freshness, total]
      properties:
        capability: { type: number, format: double }
        price: { type: number, format: double }
        latency: { type: number, format: double }
        trust: { type: number, format: double }
        locality: { type: number, format: double }
        freshness: { type: number, format: double }
        total: { type: number, format: double }
    ComputeCandidate:
      type: object
      required: [offer_id, machine_id, organization_id, geography, trust, same_organization, available, hourly_micros, estimated_micros, latency_known, scores]
      properties:
        offer_id: { type: string, format: uuid }
        machine_id: { type: string }
        machine_name: { type: string }
        organization_id: { type: string, format: uuid }
        agent_url: { type: string, format: uri }
        geography: { $ref: '#/components/schemas/ComputeGeography' }
        trust: { $ref: '#/components/schemas/ComputeTrustTier' }
        same_organization: { type: boolean }
        available: { $ref: '#/components/schemas/ComputeResources' }
        hourly_micros: { type: integer, format: int64, minimum: 0 }
        estimated_micros: { type: integer, format: int64, minimum: 0, description: Quote for the requested duration, in micro-units. }
        currency: { type: string, minLength: 3, maxLength: 3 }
        latency_millis: { type: number, format: double, minimum: 0 }
        latency_known: { type: boolean, description: False when no sample applies; scoring then uses the neutral value rather than pretending a measurement exists. }
        scores: { $ref: '#/components/schemas/ComputeScores' }
        warnings: { type: array, items: { type: string } }
        compatibility:
          type: object
          additionalProperties: true
          description: Restore compatibility report for the checkpoint, produced by the same checker the migration pre-flight uses.
    ComputeRejectionCode:
      type: string
      enum:
        - TRADING_DISABLED
        - CROSS_ORGANIZATION_NOT_REQUESTED
        - VISIBILITY_FORBIDDEN
        - ORGANIZATION_DENIED
        - ORGANIZATION_NOT_ALLOWED
        - SELF_PLACEMENT
        - MACHINE_EXCLUDED
        - OFFER_UNAVAILABLE
        - OUTSIDE_AVAILABILITY_WINDOW
        - MACHINE_PRESENCE_STALE
        - TRUST_TOO_LOW
        - REGION_NOT_ALLOWED
        - COUNTRY_NOT_ALLOWED
        - DATA_RESIDENCY_FORBIDDEN
        - CPU_INSUFFICIENT
        - MEMORY_INSUFFICIENT
        - STORAGE_INSUFFICIENT
        - NETWORK_INSUFFICIENT
        - GPU_INCOMPATIBLE
        - FEATURE_MISSING
        - LATENCY_EXCEEDED
        - LATENCY_UNMEASURED
        - PRICE_EXCEEDED
        - CURRENCY_MISMATCH
        - STATE_TOO_LARGE
        - DURATION_TOO_LONG
        - ENCRYPTED_STATE_REQUIRED
        - GPU_SHARING_FORBIDDEN
        - RESTORE_INCOMPATIBLE
    ComputeRejection:
      type: object
      required: [offer_id, machine_id, code, reason]
      properties:
        offer_id: { type: string, format: uuid }
        machine_id: { type: string }
        code: { $ref: '#/components/schemas/ComputeRejectionCode' }
        reason: { type: string }
    Placement:
      type: object
      required: [candidates, rejected, evaluated, trading_enabled, weights, evaluated_at]
      properties:
        candidates:
          type: array
          description: Feasible destinations, best first. Ties break deterministically.
          items: { $ref: '#/components/schemas/ComputeCandidate' }
        rejected:
          type: array
          description: One entry per offer that failed a hard filter, so a caller can see why capacity was not usable.
          items: { $ref: '#/components/schemas/ComputeRejection' }
        evaluated: { type: integer, minimum: 0 }
        trading_enabled: { type: boolean }
        weights: { $ref: '#/components/schemas/ComputeWeights' }
        evaluated_at: { type: string, format: date-time }
    CreateComputeReservationRequest:
      type: object
      required: [offer_id, requested]
      properties:
        offer_id: { type: string, format: uuid }
        workload_id: { type: string, format: uuid }
        migration_id: { type: string, format: uuid }
        checkpoint_id: { type: string, format: uuid }
        source_machine_id: { type: string }
        source_geography: { $ref: '#/components/schemas/ComputeGeography' }
        requested: { $ref: '#/components/schemas/ComputeResources' }
        state_bytes: { type: integer, format: int64, minimum: 0 }
        duration_seconds: { type: integer, format: int64, minimum: 0 }
        constraints: { $ref: '#/components/schemas/ComputeConstraints' }
        ttl_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
          description: How long the hold lasts. Defaults to 900 seconds; the ceiling is 86400 so abandoned capacity is always reclaimed.
    ComputeReservationState:
      type: string
      enum: [PENDING, ACTIVE, RELEASED, EXPIRED, FAILED]
      description: |
        RELEASED and EXPIRED are terminal. Legal transitions are PENDING to any
        other state, ACTIVE to RELEASED, EXPIRED, or FAILED, and FAILED to
        RELEASED.
    ComputeReservation:
      type: object
      required: [id, offer_id, organization_id, machine_id, requested, state, hourly_micros, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        offer_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        machine_id: { type: string }
        workload_id: { type: string, format: uuid }
        migration_id: { type: string, format: uuid }
        requested: { $ref: '#/components/schemas/ComputeResources' }
        state: { $ref: '#/components/schemas/ComputeReservationState' }
        hourly_micros: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        released_at: { type: string, format: date-time, nullable: true }
        error: { type: string }
    ComputeReservationStateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/ComputeReservationState' }
        error: { type: string, maxLength: 1000, description: Recorded when moving to FAILED. }
    AgentCommandRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, pause, resume, stop, delete, checkpoint, restore, migrate]
          description: Case-insensitive.
        workload_id: { type: string, format: uuid, description: Required for every action; the workload must live on the addressed machine. }
        checkpoint_id: { type: string, format: uuid, description: Required for restore. }
        destination_id: { type: string, description: Destination machine id. Required for migrate. }
        mode: { type: string, enum: [cold, live], description: Migration mode. Defaults to cold. }
        timeout_seconds: { type: integer, minimum: 0, description: Defaults to 30 and is clamped to 600. }
        spec: { type: object, additionalProperties: true }
    AgentCommandResponse:
      type: object
      required: [machine, action, result]
      properties:
        machine: { type: string }
        action: { type: string }
        result:
          description: The agent's own response for the dispatched action, passed through unchanged (any JSON value — object, array, scalar, or null).
        workload: { $ref: '#/components/schemas/Workload' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        migration: { $ref: '#/components/schemas/MigrationJob' }
    ReconcileResult:
      type: object
      required: [reconciled_workloads, failed]
      properties:
        reconciled_workloads: { type: integer, minimum: 0 }
        failed:
          type: object
          description: Per-resource failures keyed by machine id, workload id, or a prefixed resource key such as "checkpoint:<id>".
          additionalProperties: { type: string }
