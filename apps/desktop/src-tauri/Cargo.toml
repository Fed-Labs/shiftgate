[package]
name = "shift-desktop"
version = "0.2.0"
description = "SHIFT desktop client — machines, workloads, migrations, and history for the SHIFT state-transfer system."
edition = "2021"
rust-version = "1.77"

[lib]
name = "shift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
