apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shift.fullname" . }}-control
  labels:
    {{- include "shift.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.minReplicas }}{{ else }}2{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shift.name" . }}-control
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shift.name" . }}-control
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # Spread replicas across nodes/zones when the scheduler has topology
      # labels; a single-node cluster remains schedulable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "shift.name" . }}-control
              app.kubernetes.io/instance: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:

        - name: control
          image: "{{ include "shift.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--listen", "{{ .Values.control.listen }}"]
          env:
            - name: SHIFT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.control.databaseURLSecret }}
                  key: {{ .Values.control.databaseURLKey }}
            - name: SHIFT_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.control.tokenPepperSecret }}
                  key: {{ .Values.control.tokenPepperKey }}
            - name: SHIFT_PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.control.passwordPepperSecret }}
                  key: {{ .Values.control.passwordPepperKey }}
            {{- if .Values.control.metricsTokenSecret }}
            - name: SHIFT_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.control.metricsTokenSecret }}
                  key: {{ .Values.control.metricsTokenKey }}
            {{- end }}
            {{- if .Values.control.trustedProxies }}
            - name: SHIFT_TRUSTED_PROXIES
              value: {{ join "," .Values.control.trustedProxies | quote }}
            {{- end }}
            {{- if .Values.control.allowedOrigins }}
            - name: SHIFT_ALLOWED_ORIGINS
              value: {{ join "," .Values.control.allowedOrigins | quote }}
            {{- end }}
            - name: SHIFT_MIGRATION_WORKER_CONCURRENCY
              value: {{ .Values.control.migrationWorkerConcurrency | quote }}
            - name: SHIFT_ALLOW_REMOTE_AGENT_DISPATCH
              value: {{ .Values.control.allowRemoteAgentDispatch | quote }}
            {{- with .Values.control.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ include "shift.listenPort" . | int }}
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
