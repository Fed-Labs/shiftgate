services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shift}
      POSTGRES_USER: ${POSTGRES_USER:-shift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - shift-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  control:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.control
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHIFT_DATABASE_URL: postgres://${POSTGRES_USER:-shift}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shift}?sslmode=disable
      SHIFT_TOKEN_PEPPER: ${SHIFT_TOKEN_PEPPER:?set SHIFT_TOKEN_PEPPER}
      SHIFT_PASSWORD_PEPPER: ${SHIFT_PASSWORD_PEPPER:?set SHIFT_PASSWORD_PEPPER}
      SHIFT_CONTROL_LISTEN: 0.0.0.0:8090
      # Browser origins the web dashboard may call this API from; without an
      # entry the dashboard cannot authenticate (the browser blocks it), while
      # the CLI and agents are unaffected.
      SHIFT_ALLOWED_ORIGINS: ${SHIFT_ALLOWED_ORIGINS:-}
      # Platform-hosted checkpoint storage. Opt in with `--profile storage`
      # (which starts minio below) and SHIFT_STORAGE_ENABLED=true. The MinIO
      # credentials must match the minio service's root user and password.
      SHIFT_STORAGE_ENABLED: ${SHIFT_STORAGE_ENABLED:-false}
      SHIFT_STORAGE_ENDPOINT: http://minio:9000
      SHIFT_STORAGE_PUBLIC_ENDPOINT: ${SHIFT_STORAGE_PUBLIC_ENDPOINT:-http://minio:9000}
      SHIFT_STORAGE_REGION: ${SHIFT_STORAGE_REGION:-us-east-1}
      SHIFT_STORAGE_BUCKET: ${SHIFT_STORAGE_BUCKET:-shift-checkpoints}
      SHIFT_STORAGE_ACCESS_KEY_ID: ${SHIFT_STORAGE_ACCESS_KEY_ID:-shift-storage}
      SHIFT_STORAGE_SECRET_ACCESS_KEY: ${SHIFT_STORAGE_SECRET_ACCESS_KEY:-shift-storage-secret}
    ports:
      - "${SHIFT_CONTROL_PORT:-8090}:8090"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # Platform-hosted checkpoint storage: one MinIO instance, one bucket, one
  # prefix per organization. Agents never see the root credential — the
  # control plane brokers short-lived scoped credentials instead.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [storage]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SHIFT_STORAGE_ACCESS_KEY_ID:-shift-storage}
      MINIO_ROOT_PASSWORD: ${SHIFT_STORAGE_SECRET_ACCESS_KEY:-shift-storage-secret}
    volumes:
      - shift-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [storage]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set shift http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "shift/$${SHIFT_STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${SHIFT_STORAGE_ACCESS_KEY_ID:-shift-storage}
      MINIO_ROOT_PASSWORD: ${SHIFT_STORAGE_SECRET_ACCESS_KEY:-shift-storage-secret}
      SHIFT_STORAGE_BUCKET: ${SHIFT_STORAGE_BUCKET:-shift-checkpoints}
    security_opt:
      - no-new-privileges:true

  agent:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.agent
    profiles: [agent]
    command:
      - --state-dir
      - /var/lib/shift
      - --listen
      - unix:///run/shift/agent.sock
      - --remote-listen
      - tcp://0.0.0.0:8443
    volumes:
      - shift-agent-state:/var/lib/shift
      - shift-agent-run:/run/shift
    ports:
      - "${SHIFT_AGENT_PORT:-8443}:8443"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
    restart: unless-stopped

volumes:
  shift-postgres:
  shift-agent-state:
  shift-agent-run:
  shift-minio:
